
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tarteel Online Quran - Enroll</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {margin:0;font-family:Arial, sans-serif;line-height:1.6;background:#f9f9f9;}
a {text-decoration:none;color:inherit;}
header {background:#0a5c36;color:#fff;padding:20px 15px;text-align:center;position:sticky;top:0;z-index:100;}
header h1 {margin:0;font-size:28px;}
nav {margin-top:10px;}
nav a {color:#fff;padding:10px 15px;margin:0 5px;display:inline-block;border-radius:5px;transition:0.3s;}
nav a:hover {background:#0d5fb8;}
section {padding:40px 20px;max-width:600px;margin:auto;background:#fff;box-shadow:0 4px 8px rgba(0,0,0,0.1);border-radius:10px;}
h2 {color:#0a5c36;text-align:center;margin-bottom:20px;}
form {display:flex;flex-direction:column;}
label {margin:10px 0 5px;font-weight:bold;}
input, select {padding:10px;margin-bottom:15px;border-radius:5px;border:1px solid #ccc;font-size:16px;}
input:focus, select:focus {outline:none;border-color:#1e90ff;box-shadow:0 0 5px rgba(30,144,255,0.5);}
button {padding:12px;background:#1e90ff;color:#fff;font-size:16px;border:none;border-radius:5px;cursor:pointer;transition:0.3s;}
button:hover {background:#0d5fb8;transform:scale(1.02);}
footer {background:#222;color:#fff;text-align:center;padding:15px;margin-top:40px;}
@media (max-width:768px){
    nav a {display:block;margin:5px 0;}
    section {padding:30px 15px;}
}
</style>
</head>
<body>

<header>
<h1>Tarteel Online Quran</h1>
<nav>
<a href="index.html">Home</a>
<a href="ourcourses.html">Our Courses</a>
<a href="enroll.html">Enroll</a>
<a href="quran.html">Quran</a>
</nav>
</header>

<section>
<h2>Enroll Now</h2>
<p style="text-align:center;">Fill the form below to join Tarteel Online Quran classes.</p>

<form action="#" method="post">
  <label for="name">Full Name</label>
  <input type="text" id="name" name="name" placeholder="Enter your full name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="Enter your email" required>

  <label for="phone">Phone Number</label>
  <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

  <label for="course">Select Course</label>
  <select id="course" name="course" required>
    <option value="">--Select--</option>
    <option value="noorani">Noorani Qaida (Basics)</option>
    <option value="tajweed">Quran Reading with Tajweed</option>
    <option value="hifz">Hifz-ul-Quran</option>
    <option value="duas">Islamic Duas & Namaz</option>
  </select>

  <label for="schedule">Preferred Schedule</label>
  <select id="schedule" name="schedule" required>
    <option value="">--Select--</option>
    <option value="daily">Daily Classes</option>
    <option value="weekend">Weekend Classes</option>
    <option value="flexible">Flexible Timing</option>
  </select>

  <button type="submit">Submit Enrollment</button>
</form>
</section>

<footer>
<p>© 2026 Tarteel Online Quran | All Rights Reserved</p>
</footer>

</body>
</html>
